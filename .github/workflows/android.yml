
name: Motor Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build for Android (ARM64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28

      - name: Verify NDK Clang
        env:
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail

          CLANG="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"

          "$CLANG" --version

          VERSION=$("$CLANG" --version | sed -nE 's/.*clang version ([0-9]+).*/\1/p' | head -n 1)

          if [ -z "$VERSION" ] || [ "$VERSION" -lt 19 ]; then
            echo "::error::Motor requires Clang 19 or newer"
            exit 1
          fi

      - name: Fix ARM64 architecture flag
        run: |
          sed -i 's/-march=native/-march=armv8-a/g' CMakeLists.txt

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Motor Engine
        run: cmake --build build --config Release -j $(nproc)

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Motor-Android-arm64
          path: build/motor
          retention-days: 7
