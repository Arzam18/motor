
name: Motor Android Build

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-android:
    name: Build for Android (ARM64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28

      - name: Verify NDK compiler
        env:
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail

          CLANG="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"

          test -x "$CLANG" || {
            echo "::error::NDK clang++ was not found at $CLANG"
            exit 1
          }

          "$CLANG" --version

          VERSION=$("$CLANG" --version | sed -nE 's/.*clang version ([0-9]+).*/\1/p' | head -n 1)

          if [ -z "$VERSION" ] || [ "$VERSION" -lt 19 ]; then
            echo "::error::Motor requires Clang 19 or newer"
            exit 1
          fi

      - name: Fix ARM64 architecture flag
        run: |
          sed -i 's/-march=native/-march=armv8-a/g' CMakeLists.txt

      - name: Download NNUE network
        run: |
          set -euo pipefail

          test -s net.txt || {
            echo "::error::net.txt is missing or empty"
            exit 1
          }

          NET_URL="$(head -n 1 net.txt | tr -d '\r')"

          case "$NET_URL" in
            https://*) ;;
            *)
              echo "::error::Invalid NNUE URL in net.txt"
              exit 1
              ;;
          esac

          curl --fail --location --retry 3 \
            "$NET_URL" \
            --output nnue.bin

          test -s nnue.bin

          echo "Downloaded NNUE network: $(stat -c '%s' nnue.bin) bytes"

      - name: Configure CMake
        env:
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail

          NDK_BIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"

          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DCMAKE_C_COMPILER="$NDK_BIN/clang" \
            -DCMAKE_CXX_COMPILER="$NDK_BIN/clang++" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Verify configured compiler
        run: |
          set -euo pipefail

          grep '^CMAKE_CXX_COMPILER:FILEPATH=' build/CMakeCache.txt \
            || grep '^CMAKE_CXX_COMPILER:STRING=' build/CMakeCache.txt \
            || true

          cmake --build build --verbose --config Release -- -n

      - name: Build Motor Engine
        run: |
          cmake --build build --config Release -j "$(nproc)"

      - name: Verify Engine
        run: |
          set -euo pipefail
          test -f build/motor
          file build/motor

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Motor-Android-arm64
          path: build/motor
          if-no-files-found: error
          retention-days: 7
